[tools]
node = "26"
pnpm = "12"

[tasks.setup]
description = "Install the pinned toolchain and workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.format]
description = "Format the workspace"
run = "pnpm format"

[tasks.check]
description = "Run the full repository validation suite"
run = "pnpm lint && pnpm format:check && pnpm typecheck && pnpm build && pnpm test"
